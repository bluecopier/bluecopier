[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

[project]
name = "bluecopier"
description = "Easy to use code high quality code templates"
readme = "README.md"
keywords = [
]
license = "MIT"
authors = [{ name = "Johan Dahlin", email = "jdahlin@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
  # https://pypi.org/classifiers/
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = [
  "version",
]
dependencies = [
  "appdirs",
  "commentjson",
  "jinja2",
  "pre-commit",
  "PyGitHub",
  "PyYAML",
  "requests",
  "rich",
  "tomlkit",
  "typer",
]
[project.optional-dependencies]
dev = [
  "black",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
]
test = [
  "pytest",
  "pytest-github-actions-annotate-failures",
]
types = [
  "mkdocs",
  "mkdocs-gen-files",
  "PyGithub",
  "tomlkit",
  "typer[rich]",
  "types-appdirs",
  "types-jinja2",
  "types-PyYAML",
  "types-requests",
]
[project.urls]
Source = "https://github.com/jdahlin/bluecopier"
Tracker = "https://github.com/jdahlin/bluecopier/issues"

[tool.hatch.version]
path = "src/bluecopier/__version__.py"

[tool.black]
line-length = 110
target-version = ["py311"]
include = "src"

# https://hatch.pypa.io/latest/version/#configuration

[tool.ruff]
src = ["src"]
exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 110
select = [
  "E",     # pycodestyle (supersedes pep8)
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "C90",   # mccabe
  "I",     # isort
  "N",     # pep8-naming
  #"D",     # pydocstyle
  "UP",    # pyupgrade
  "ERA",   # eradicate
  "YTT",   # flake8-2020
  "ANN",   # flake8-annotations
  "S",     # flake8-bandit
  "BLE",   # flake8-blind-except
  "FBT",   # flake8-boolean-trap
  "B",     # flake8-bugbear
  "A",     # flake8-builtins
  "COM",   # flake8-commas
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "ICN",   # flake8-import-conventions
  "PIE",   # flake8-pie
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "Q",     # flake8-quotes
  "RSE",   # flake8-raise
  # "RET", # flake8-return
  "SLF",   # flake8-self
  "SIM",   # flake8-simplify
  "TID",   # flake8-tidy-imports
  "TCH",   # flake8-type-checking
  "ARG", # flake8-unused-arguments
  "PGH",   # pygrep-hooks
  "PLC",   # pylint Convention
  "PLE",   # pylint Error
  "PLR",   # pylint Refactor
  "PLW",   # pylint Warning
  "RUF",   # ruff-specific rules
]
ignore = [
  "ANN101",
  "ANN102",
  "ANN401",  # typing.Any is okay for kwargs
  "FBT002",  # disable for main.py only
  "EM102",   # exception must not use an f-string literal
  "S101",    # assert is useful for mypy
  "S308",    # mark_safe can be useful
  "S603",    # skipping shell=True is faster
  "PLR0913", # too many arguments
]

[tool.pytest.ini_options]
addopts =[
    "--show-capture=stdout",
    "--tb=short",
#    "-W error::Warning",
    "-vv"
]
norecursedirs = [
    ".git",
    ".ruff_cache",
    ".mypy_cache",
    "node_modules",
]
testpaths = [
    "src",
]

filterwarnings = [
    # https://pypi.org/project/lark-parser/ - v0.12.0 - 2021-08-30 -> moved to `lark`
    # https://pypi.org/project/commentjson/ - v0.9.0 - 2020-10-05
    # https://github.com/vaidik/commentjson/issues/51
    # Fixed upstream, commentjson depends on old version and seems to be unmaintained
    "ignore:module '(sre_parse|sre_constants)' is deprecate:DeprecationWarning:lark.utils",
]

[tool.mypy]
mypy_path = "src"
files = "src"
python_version = "3.11"
strict = true
warn_unused_configs = true
namespace_packages = false
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "commentjson",
]
ignore_missing_imports = true
