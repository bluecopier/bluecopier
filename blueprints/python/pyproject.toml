[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

[project]
name = "${project.name}"
description = "Easy to use code high quality code templates"
keywords = [
]
license = "${license.value}"
authors = [{ name = "${author_name}", email = "${author_email}" }]
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: ${python_version}",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = [
  "version",
]
dependencies = [
]
[project.optional-dependencies]
dev = [
  "pyproject-fmt",
]
[project.urls]
Source = "${source_repo}"
Tracker = "${issue_tracker}"

[tool.hatch.version]
path = "src/app/__version__.py"

[tool.pytest.ini_options]
addopts =[
    "--show-capture=stdout",
    "--tb=short",
    "-W error::Warning",
    "-vv"
]
norecursedirs = [
    ".git",
    ".ruff_cache",
    ".mypy_cache",
    "node_modules",
]

filterwarnings = [
    # https://pypi.org/project/lark-parser/ - v0.12.0 - 2021-08-30 -> moved to `lark`
    # https://pypi.org/project/commentjson/ - v0.9.0 - 2020-10-05
    # https://github.com/vaidik/commentjson/issues/51
    # Fixed upstream, commentjson depends on old version and seems to be unmaintained
    "ignore:module '(sre_parse|sre_constants)' is deprecate:DeprecationWarning:lark.utils",
]
