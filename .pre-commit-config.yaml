default_language_version:
    python: python3.11

repos:
  - hooks:
      - id: pyproject-fmt
        exclude: ^blueprints
    repo: https://github.com/tox-dev/pyproject-fmt
    rev: 1.1.0
  - hooks:
      - id: mypy
        additional_dependencies: [
          "mkdocs",
          "mkdocs-gen-files",
          "PyGithub",
          "rich",
          "tomlkit",
          "typer",
          "types-appdirs",
          "types-jinja2",
          "types-PyYAML",
          "types-requests",
        ]
        args: [--junit-xml=.mypy_cache/junit.xml]
        exclude: ^blueprints
    repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
  - hooks:
      - id: black
        exclude: ^blueprints
    repo: https://github.com/psf/black
    rev: 23.7.0
  - hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix, src ]
        exclude: ^blueprints
    repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.286
